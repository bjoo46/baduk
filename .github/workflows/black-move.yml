name: black move

on:
  push:
    branches: [main]
    paths:
      - "go_board_*.png"
  workflow_dispatch:

concurrency:
  group: black-move
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  play-black:
    # Our own pushes use GITHUB_TOKEN and already cannot retrigger workflows.
    # This guard is the second line of defence against a self-feeding loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow numpy

      - name: Check whose turn it is
        id: turn
        run: |
          if [ -f RESULT.md ]; then
            echo "turn=finished" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          N=$(ls -1 go_board_*.png | sed 's/[^0-9]//g' | sort -n | tail -1)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          OUT=$(python baduk_tools.py read "go_board_${N}.png")
          echo "$OUT"
          B=$(echo "$OUT" | sed -n 's/.*black=\([0-9]*\).*/\1/p')
          W=$(echo "$OUT" | sed -n 's/.*white=\([0-9]*\).*/\1/p')
          echo "black=$B white=$W"
          if [ "$B" = "$W" ]; then
            echo "turn=black" >> "$GITHUB_OUTPUT"
          else
            echo "turn=white" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7.0.0
        if: steps.turn.outputs.turn == 'black'
        with:
          node-version: "20"

      - name: Install Claude Code
        if: steps.turn.outputs.turn == 'black'
        run: npm install -g --silent @anthropic-ai/claude-code

      - name: Play the black move
        if: steps.turn.outputs.turn == 'black'
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          elif [ -n "$API_KEY" ]; then
            export ANTHROPIC_API_KEY="$API_KEY"
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY 시크릿이 필요합니다."
            exit 1
          fi
          claude -p "$(cat .github/black-move.md)" \
            --permission-mode bypassPermissions \
            --output-format text

      - name: Commit and push
        if: steps.turn.outputs.turn == 'black'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "흑이 둔 수가 없습니다."
            exit 0
          fi
          N=${{ steps.turn.outputs.n }}
          M="Add go_board_$((N + 1)).png with black move"
          git commit -q -m "$M" -m "Automated black move. Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
          git push
