name: White reply

on:
  push:
    branches: [main]
    paths: ['go_board_*.png']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: white-reply-main
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Find latest black move
        id: board
        run: python auto_white.py prepare
      - name: Check API key
        id: key
        if: steps.board.outputs.play == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Set the OPENAI_API_KEY repository secret to enable automatic white moves.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Choose white move
        id: codex
        if: steps.board.outputs.play == 'true' && steps.key.outputs.ready == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          output-file: move.json
          output-schema: |
            {"type":"object","properties":{"decision":{"type":"string","enum":["play","resign"]},"move":{"type":"string"},"reason":{"type":"string"}},"required":["decision","move","reason"],"additionalProperties":false}
          prompt: |
            You play White in a continuing 19x19 game of Go. Read board_state.txt.
            Coordinates are A-H,J-T and rows 1-19 from the bottom. The list
            contains every occupied intersection; all unlisted points are empty.
            Choose one strong, legal White move, taking the whole position into
            account. Use "resign" only when the position is clearly lost, not
            merely because White is behind. Return JSON only, with decision
            "play" and move such as "K4", or decision "resign" and move "".
            Explain the choice in a brief Korean reason. Do not modify files.
      - name: Render and verify reply
        id: render
        if: steps.codex.outcome == 'success'
        run: python auto_white.py apply
      - name: Save next board or resignation
        if: steps.render.outcome == 'success'
        env:
          TARGET: ${{ steps.render.outputs.target }}
          RESULT: ${{ steps.render.outputs.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          git commit -m "White reply: $RESULT $TARGET"
          git push origin HEAD:main
